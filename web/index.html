<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1c15" media="(prefers-color-scheme: dark)" />
    <title>Organizador de Estudos</title>
    <script>
      // aplica o tema escolhido antes da primeira pintura (evita piscar no tema errado)
      try {
        var raiz = document.documentElement;
        var a = localStorage.getItem("estudos.tema-ativo");
        if (a) {
          a = JSON.parse(a);
          raiz.setAttribute("data-tema", a.base);
          for (var k in a.vars) raiz.style.setProperty(k, a.vars[k]);
        } else {
          var t = localStorage.getItem("estudos.tema");
          if (t === "claro" || t === "escuro") raiz.setAttribute("data-tema", t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
